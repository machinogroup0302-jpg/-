# まちの顧客台帳（https://machino-crm.web.app）に crm/index.html を公開する
#   index.html だけを差し替え、manifest.json・icon.png や設定は公開中のものを引き継ぐ
#   公開中の画面がこのリポジトリのどの版とも違うとき（ほかで直されたとき）は、上書きせずに止まる
#   カギは FIREBASE_SA_CRM（machino-crm 用の秘密鍵）。なければ FIREBASE_SA を使う
name: 顧客台帳を公開

on:
  push:
    branches: [claude/tender-allen-llk9mh]
    paths: ['crm/index.html', 'crm/deploy/**', '.github/workflows/crm-deploy.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploy（公開する）か pull（公開中の画面をリポジトリに取り込むだけ）'
        default: deploy

permissions:
  contents: write

concurrency:
  group: crm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SA: ${{ secrets.FIREBASE_SA_CRM != '' || secrets.FIREBASE_SA != '' }}
    steps:
      - name: Firebase のカギがまだなら、何もしないで終わる
        if: env.HAS_SA != 'true'
        run: echo "::notice::FIREBASE_SA（Firebase の秘密鍵）がまだ入っていないので、公開はしませんでした"
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
      - name: 公開中の画面をリポジトリに取り込む（pull のときだけ）
        if: github.event.inputs.mode == 'pull'
        run: |
          curl -fsS "https://machino-crm.web.app/index.html?v=$(date +%s)" -H 'Cache-Control: no-cache' > crm/index.html
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm/index.html
          git diff --cached --quiet && { echo "変わりなし"; exit 0; }
          git commit -m "顧客台帳：公開中の画面（machino-crm.web.app）をそのまま取り込む"
          git push origin HEAD:${{ github.ref_name }}
      - name: 公開中と比べてよい過去の版を集める
        if: env.HAS_SA == 'true' && github.event.inputs.mode != 'pull'
        run: |
          mkdir -p "$RUNNER_TEMP/ok"
          git fetch -q origin claude/fervent-lamport-u59ti8 || true
          for c in $(git log --all --format=%H -- crm/index.html); do git show "$c:crm/index.html" > "$RUNNER_TEMP/ok/$c.html" 2>/dev/null || true; done
          ls "$RUNNER_TEMP/ok" | wc -l
      - name: 公開する
        if: env.HAS_SA == 'true' && github.event.inputs.mode != 'pull'
        working-directory: crm/deploy
        env:
          SA: ${{ secrets.FIREBASE_SA_CRM || secrets.FIREBASE_SA }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          echo "使うカギのアカウント: $(node -p "require('$RUNNER_TEMP/sa.json').client_email")"
          npm install --no-save --no-audit --no-fund google-auth-library@9 > /dev/null
          node deploy.mjs ../index.html "$RUNNER_TEMP/ok"
      - name: 止まったときは、公開中の画面を保存しておく
        if: failure() && env.HAS_SA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-index
          path: ${{ runner.temp }}/live.html
          if-no-files-found: ignore
      - name: 止まったときは、公開中の画面との違いを表示する
        if: failure() && env.HAS_SA == 'true'
        run: |
          L="$RUNNER_TEMP/live.html"; [ -f "$L" ] || exit 0
          sp() { tr -d '\r' < "$1" | sed 's/;/;\n/g; s/></>\n</g'; }
          sp "$L" > "$RUNNER_TEMP/l.txt"; best=""; bn=999999
          for f in "$RUNNER_TEMP"/ok/*.html; do sp "$f" > "$RUNNER_TEMP/o.txt"; n=$(diff "$RUNNER_TEMP/o.txt" "$RUNNER_TEMP/l.txt" | wc -l); echo "$(basename $f) $n"; if [ "$n" -lt "$bn" ]; then bn=$n; best=$f; fi; done
          echo "=== 一番近い版: $(basename $best)（違い $bn 行）"
          sp "$best" > "$RUNNER_TEMP/o.txt"; diff "$RUNNER_TEMP/o.txt" "$RUNNER_TEMP/l.txt" | cut -c1-400 | head -400 || true
