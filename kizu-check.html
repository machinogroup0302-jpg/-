<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1b2a">
<title>キズ修理チェックシート | まちのグループ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --navy-2: #1b2b40;
    --yellow: #f5c518;
    --yellow-dark: #d9ab00;
    --text: #1d2733;
    --muted: #5b6776;
    --bg: #ffffff;
    --bg-soft: #f4f6f9;
    --line: #e1e6ec;
    --radius: 14px;

    --t-scratch: #f08c00;
    --t-dent: #2f6fe4;
    --t-crack: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    color: var(--text); background: var(--bg-soft); line-height: 1.6;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

  header {
    position: sticky; top: 0; z-index: 30; background: rgba(13,27,42,.96); color: #fff;
    backdrop-filter: blur(8px);
  }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 16px; color: #fff; text-decoration: none; }
  .logo-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--yellow); color: var(--navy); display: grid; place-items: center; font-size: 14px; }
  .header-sub { font-size: 12px; opacity: .7; }

  h1 { font-size: 22px; font-weight: 900; margin: 20px 0 4px; }
  .lead { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .card { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; font-weight: 900; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .card h2 .num { width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: var(--yellow); font-size: 12px; display: grid; place-items: center; }
  .card h2 .aside { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }

  .field { margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .field input, .field textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; font-size: 16px; background: #fff;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--yellow-dark) !important; }
  .field textarea { min-height: 72px; resize: vertical; }
  .yen { position: relative; }
  .yen input { padding-left: 28px !important; text-align: right; }
  .yen::before { content: "¥"; position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; font-size: 14px; }

  .field .toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; cursor: pointer; user-select: none;
  }
  .toggle .t-label { font-weight: 700; font-size: 15px; }
  .toggle .t-label small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .switch { width: 50px; height: 30px; border-radius: 999px; background: #cfd6de; position: relative; flex-shrink: 0; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .toggle input:checked + .switch { background: var(--yellow-dark); }
  .toggle input:checked + .switch::after { transform: translateX(20px); }
  .toggle:has(input:checked) { border-color: var(--yellow-dark); background: #fffbea; }

  /* 描く道具 */
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .tool {
    border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 0 6px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700;
  }
  .tool svg { width: 26px; height: 18px; }
  .tool.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--line); margin-bottom: 8px; }
  .tab {
    flex: 1; border: none; background: none; padding: 8px 0; font-size: 14px; font-weight: 700; color: var(--muted);
    border-bottom: 3px solid transparent; margin-bottom: -1.5px; position: relative;
  }
  .tab.on { color: var(--navy); border-bottom-color: var(--yellow); }
  .tab .cnt { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; border-radius: 8px; background: var(--t-crack); color: #fff; font-size: 10px; margin-left: 2px; vertical-align: 1px; }
  .stage { position: relative; }
  .stage svg { width: 100%; height: auto; display: none; overflow: visible; touch-action: none; user-select: none; -webkit-user-select: none; }
  .stage svg.on { display: block; }
  .stage svg.narrow { max-width: 340px; margin: 0 auto; }
  .stage-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .stage-foot .cap { font-size: 12px; font-weight: 700; color: var(--muted); }
  .undo { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; }
  .undo:disabled { opacity: .4; }

  .p { fill: #fff; stroke: var(--navy); stroke-width: 1.3; stroke-linejoin: round; }
  .p.tire { fill: #3a4654; }
  .body { fill: #cfd8e2; }
  .glass { fill: #dbe6f1; stroke: var(--navy); stroke-width: .8; pointer-events: none; }
  .arch { fill: #fff; }
  .rim { fill: #aab4bf; stroke: #3a4654; stroke-width: 1; pointer-events: none; }
  .plate { fill: #fff; stroke: var(--navy); stroke-width: .8; pointer-events: none; }
  .deco-tire { fill: #3a4654; pointer-events: none; }
  .mdl { display: none; }
  body.mdl-on .mdl { display: inline; }
  .p.mdl { stroke-dasharray: 3 2; }

  /* 描いた印 */
  .marks { pointer-events: none; }
  .mk { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .mk.circle { stroke-width: 3; }
  .k-scratch .mk { stroke: var(--t-scratch); }
  .k-dent .mk { stroke: var(--t-dent); fill: rgba(47,111,228,.15); }
  .k-crack .mk { stroke: var(--t-crack); }
  .mn circle { stroke: #fff; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .k-scratch .mn circle { fill: var(--t-scratch); }
  .k-dent .mn circle { fill: var(--t-dent); }
  .k-crack .mn circle { fill: var(--t-crack); }
  .mn text { fill: #fff; font-weight: 900; text-anchor: middle; dominant-baseline: central; font-family: inherit; }
  .hit { fill: none; stroke: transparent; stroke-width: 22; vector-effect: non-scaling-stroke; }
  .erase-mode .hit { pointer-events: all; cursor: pointer; }
  .erase-mode .marks g:hover .mk { opacity: .5; }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-size: 12px; margin-top: 10px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }

  .badge { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; padding: 2px 8px; border-radius: 999px; flex-shrink: 0; }
  .b-scratch { background: var(--t-scratch); }
  .b-dent { background: var(--t-dent); }
  .b-crack { background: var(--t-crack); }

  .empty { font-size: 13px; color: var(--muted); text-align: center; padding: 12px 0; }
  .x { border: none; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 6px; margin-left: auto; flex-shrink: 0; }

  /* キズ・ヘコミの金額 */
  .mrow { border-top: 1px solid var(--line); padding: 10px 0; }
  .mrow:first-child { border-top: none; padding-top: 0; }
  .mrow-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .mrow-head b { font-size: 14px; min-width: 0; }
  .mnum { width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 900; display: grid; place-items: center; flex-shrink: 0; }
  .mrow-body { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; flex-shrink: 0; }
  .seg button { border: none; background: #fff; padding: 9px 14px; font-weight: 900; font-size: 15px; }
  .seg button + button { border-left: 1.5px solid var(--line); }
  .seg button.on { background: var(--navy); color: var(--yellow); }
  .mrow-body .yen { flex: 1; }
  .money-in { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 16px; background: #fff; }

  /* パーツ */
  .suggest { margin-bottom: 12px; }
  .suggest p { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1.5px dashed #b9c3ce; background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .chip::before { content: "＋ "; color: var(--yellow-dark); font-weight: 900; }
  .prow { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .prow-head { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
  .prow-head input { flex: 1; min-width: 0; border: none; border-bottom: 1.5px solid var(--line); padding: 4px 2px; font-size: 16px; font-weight: 700; border-radius: 0; }
  .prow-body { display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
  .prow-body label { display: block; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .prow-body .qty { width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 6px; font-size: 16px; text-align: center; }
  .prow-calc { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .prow-calc b { font-size: 17px; color: var(--text); }
  .add-part { width: 100%; border: 1.5px dashed #b9c3ce; background: var(--bg-soft); border-radius: 12px; padding: 12px; font-weight: 700; }
  .foot-note { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* 見積金額 */
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; font-size: 14px; }
  .sum-row .v { font-weight: 700; font-variant-numeric: tabular-nums; }
  .sum-row .fixed { font-size: 11px; background: var(--bg-soft); border-radius: 4px; padding: 0 5px; margin-left: 4px; color: var(--muted); }
  .sum-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid var(--navy); margin-top: 6px; padding-top: 10px; }
  .sum-total span { font-weight: 900; }
  .sum-total .v { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .deduct { margin-top: 16px; background: var(--bg-soft); border-radius: 12px; padding: 12px; }
  .deduct h3 { font-size: 13px; font-weight: 900; margin-bottom: 8px; }
  .deduct .line-in { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 0; font-size: 14px; }
  .deduct .line-in .yen { width: 150px; }
  .net { display: flex; justify-content: space-between; align-items: baseline; border-top: 1.5px dashed #b9c3ce; margin-top: 8px; padding-top: 8px; }
  .net span { font-weight: 900; font-size: 14px; }
  .net .v { font-size: 20px; font-weight: 900; }
  .net.minus .v { color: var(--t-crack); }

  /* 保存したシート */
  .rec { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .rec:first-child { border-top: none; }
  .rec-main { flex: 1; min-width: 0; }
  .rec-main b { display: block; font-size: 15px; }
  .rec-main small { color: var(--muted); font-size: 12px; }
  .rec button { border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .rec button.del { color: var(--t-crack); }
  .mini-tag { display: inline-block; font-size: 10px; font-weight: 700; background: #fff3c4; color: #8a6d00; border-radius: 4px; padding: 0 5px; margin-left: 4px; vertical-align: 2px; }

  /* 下の操作バー */
  .actions {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.97);
    border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .actions .wrap { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; padding: 0; }
  .btn { border: none; border-radius: 999px; padding: 14px 8px; font-weight: 700; font-size: 15px; }
  .btn-primary { background: var(--yellow); color: var(--navy); }
  .btn-sub { background: var(--bg-soft); border: 1.5px solid var(--line); }
  .btn:active { transform: scale(.97); }

  /* 印を描いたあとに大きさを選ぶシート */
  #backdrop { position: fixed; inset: 0; background: rgba(13,27,42,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .15s; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: #fff; border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(16px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .2s;
    max-width: 720px; margin: 0 auto;
  }
  body.sheet-open #backdrop { opacity: 1; pointer-events: auto; }
  body.sheet-open #sheet { transform: none; }
  #sheet .s-title { font-size: 17px; font-weight: 900; margin-bottom: 12px; text-align: center; }
  .size-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .size-btns button { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 0; }
  .size-btns button b { display: block; font-size: 22px; font-weight: 900; line-height: 1.2; }
  .size-btns button small { font-size: 12px; color: var(--muted); }
  .size-btns button.on { border-color: var(--navy); background: var(--navy); color: var(--yellow); }
  .size-btns button.on small { color: #fff; }
  .sheet-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet-sub button { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 0; font-weight: 700; }
  #sheetDelete { color: var(--t-crack); }

  #toast {
    position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--navy); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 999px; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }

  .note { font-size: 12px; color: var(--muted); margin: 4px 0 24px; }

  @media print {
    header, .actions, #records-card, .note, .hint, .tools, .tabs, .undo, .suggest, .add-part, .x, #sheet, #backdrop { display: none !important; }
    body { background: #fff; padding: 0; }
    .card { break-inside: avoid; }
    .stage svg { display: block !important; margin-bottom: 8px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap header-inner">
    <a class="logo" href="./"><span class="logo-mark">M</span>まちのグループ</a>
    <span class="header-sub">社内用</span>
  </div>
</header>

<main class="wrap">
  <h1>キズ修理チェックシート</h1>
  <p class="lead">アルファード／ヴェルファイア用。車の図に線や丸を描いてキズの場所を記録します。</p>

  <section class="card">
    <h2><span class="num">1</span>車両</h2>
    <div class="field">
      <label for="plate">登録番号</label>
      <input id="plate" type="text" placeholder="例）大宮 300 あ 12-34" autocomplete="off">
    </div>
    <div class="field">
      <label for="date">見積日</label>
      <input id="date" type="date">
    </div>
    <div class="field">
      <label class="toggle">
        <span class="t-label">モデリスタ<small>エアロ（フロント・サイド・リヤ）付き</small></span>
        <input id="mdl" type="checkbox">
        <span class="switch"></span>
      </label>
    </div>
  </section>

  <section class="card" id="draw-card">
    <h2><span class="num">2</span>キズの場所を描く<span class="aside" id="markCount"></span></h2>
    <div class="tools" id="tools">
      <button class="tool on" data-tool="line">
        <svg viewBox="0 0 26 18"><path d="M3 13 C 8 4, 14 16, 23 5" fill="none" stroke="var(--t-scratch)" stroke-width="3" stroke-linecap="round"/></svg>線＝キズ</button>
      <button class="tool" data-tool="circle">
        <svg viewBox="0 0 26 18"><circle cx="13" cy="9" r="7" fill="rgba(47,111,228,.15)" stroke="var(--t-dent)" stroke-width="2.5"/></svg>丸＝ヘコミ</button>
      <button class="tool" data-tool="cross">
        <svg viewBox="0 0 26 18"><path d="M7 3 L19 15 M19 3 L7 15" stroke="var(--t-crack)" stroke-width="3" stroke-linecap="round"/></svg>×＝ワレ</button>
      <button class="tool" data-tool="erase">
        <svg viewBox="0 0 26 18"><path d="M6 12 L13 5 L20 12 L16 16 L10 16 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>消す</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="stage" id="stage"></div>
    <div class="stage-foot">
      <span class="cap" id="viewCap"></span>
      <button class="undo" id="undo">↶ 1つ戻す</button>
    </div>
    <p class="hint" id="toolHint"></p>
  </section>

  <section class="card">
    <h2><span class="num">3</span>キズ・ヘコミの金額</h2>
    <div id="markList"></div>
  </section>

  <section class="card">
    <h2><span class="num">4</span>パーツ</h2>
    <div class="suggest" id="suggest"></div>
    <div id="partList"></div>
    <button class="add-part" id="addPart">＋ パーツを追加</button>
    <p class="foot-note">税抜の金額を入れると、お客さまへの請求額（税抜 × 1.1 × 1.1、10円の位で切り上げ）を自動で出します。</p>
  </section>

  <section class="card">
    <h2><span class="num">5</span>見積金額</h2>
    <div class="sum-row"><span id="sumRepairLabel">キズ・ヘコミ修理</span><span class="v" id="sumRepair">¥0</span></div>
    <div class="sum-row"><span>パーツ</span><span class="v" id="sumParts">¥0</span></div>
    <div class="sum-row"><span>出張料<span class="fixed">毎回</span></span><span class="v" id="sumTravel"></span></div>
    <div class="sum-total"><span>見積金額</span><span class="v" id="sumTotal">¥0</span></div>

    <div class="deduct">
      <h3>引かれる金額</h3>
      <div class="line-in">
        <label for="odagiri">小田切さんに渡す金額</label>
        <div class="yen"><input class="money-in" id="odagiri" type="text" inputmode="numeric" placeholder="0"></div>
      </div>
      <div class="line-in">
        <span>パーツの仕入れ（税込）</span>
        <b id="sumPartsCost">¥0</b>
      </div>
      <div class="net" id="net"><span>手元に残る金額</span><span class="v" id="sumNet">¥0</span></div>
    </div>
  </section>

  <section class="card">
    <h2><span class="num">6</span>備考</h2>
    <div class="field">
      <textarea id="memo" placeholder="お客さまの要望、作業の注意点など"></textarea>
    </div>
  </section>

  <section class="card" id="records-card">
    <h2>保存したシート<span class="aside" id="recCount"></span></h2>
    <div id="records"></div>
  </section>
  <p class="note">保存したシートはこのスマホのブラウザの中にだけ残ります。ほかの人に送るときは「送る」を使ってください。</p>
</main>

<div class="actions">
  <div class="wrap">
    <button class="btn btn-sub" id="btnNew">新規</button>
    <button class="btn btn-sub" id="btnShare">送る</button>
    <button class="btn btn-primary" id="btnSave">保存</button>
  </div>
</div>

<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <p class="s-title" id="sheetTitle"></p>
  <div class="size-btns" id="sizeBtns"></div>
  <div class="sheet-sub">
    <button id="sheetDelete">この印を消す</button>
    <button id="sheetClose">OK</button>
  </div>
</div>
<div id="toast"></div>

<script>
// 大きさごとの修理代と出張料（税込）
const SIZES = {
  L: { label: '大', price: 45000 },
  M: { label: '中', price: 35000 },
  S: { label: '小', price: 25000 },
};
const TRAVEL_FEE = 26400;

function renderView(key) {
  const { def: view, side, mirror } = VIEWS[key];
  const X = (x) => mirror ? view.w - x : x;
  const shapes = view.items.map((it) => {
    const id = it.id && (side ? it.id.replace('*', side) : it.id);
    const cls = [id ? 'p' : '', it.cls || '', id && PANELS[id].mdl ? 'mdl' : ''].join(' ').trim();
    const attrs = `class="${cls}"${id ? ` data-id="${id}"` : ''}`;
    if (it.c) return `<circle ${attrs} cx="${X(it.c[0])}" cy="${it.c[1]}" r="${it.c[2]}"/>`;
    return `<polygon ${attrs} points="${it.pts.map(([x, y]) => `${X(x)},${y}`).join(' ')}"/>`;
  }).join('');
  const narrow = view.w < 300 ? ' narrow' : '';
  return `<svg class="${narrow}" data-view="${key}" viewBox="0 0 ${view.w} ${view.h}" xmlns="http://www.w3.org/2000/svg">${shapes}<g class="marks"></g></svg>`;
}

const DRAFT_KEY = 'kizuCheck.draft';

function today() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
function blank() {
  return { id: null, plate: '', date: today(), mdl: false, marks: [], parts: [], odagiri: '', memo: '' };
}
// 前の版で保存したデータも開けるようにそろえる
function normalize(data) {
  const s = Object.assign(blank(), data);
  if (!Array.isArray(s.marks)) s.marks = [];
  if (!Array.isArray(s.parts)) s.parts = [];
  delete s.damage;
  return s;
}
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

let S = normalize(load(DRAFT_KEY, {}));
const saveDraft = () => store(DRAFT_KEY, S);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const yen = (v) => v === '' || v == null ? '' : Number(v).toLocaleString('ja-JP');
const money = (v) => '¥' + Number(v || 0).toLocaleString('ja-JP');
const num = (v) => Number(v) || 0;
function toDigits(str) {
  const d = str.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
  return d === '' ? '' : String(Number(d));
}
function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// パーツ：仕入れは税抜×1.1、請求は税抜×1.1×1.1 を10円の位で切り上げ（100円単位）
function partCalc(p) {
  const ex = num(p.price) * Math.max(1, num(p.qty));
  return { cost: Math.floor(ex * 11 / 10), charge: Math.ceil(ex * 121 / 10000) * 100 };
}
function totals() {
  const marks = activeMarks();
  const repair = marks.reduce((a, m) => a + num(m.amount), 0);
  let parts = 0, partsCost = 0;
  for (const p of S.parts) { const c = partCalc(p); parts += c.charge; partsCost += c.cost; }
  const total = repair + parts + TRAVEL_FEE;
  return { count: marks.length, repair, parts, partsCost, total, net: total - num(S.odagiri) - partsCost };
}

function toSvgPoint(svg, e) {
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10];
}
// 描いた位置の下にある部位を探す
function panelAt(svg, [x, y]) {
  const pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  const c = pt.matrixTransform(svg.getScreenCTM());
  const el = document.elementsFromPoint(c.x, c.y).find((el) => el.classList && el.classList.contains('p') && svg.contains(el));
  return el ? el.dataset.id : null;
}
function anchorOf(m) {
  if (m.type === 'line') return m.pts[Math.floor(m.pts.length / 2)];
  return [m.cx, m.cy];
}

function markShape(m, w) {
  if (m.type === 'line') {
    const pts = m.pts.map((p) => p.join(',')).join(' ');
    return `<polyline class="mk" points="${pts}"/><polyline class="hit" points="${pts}"/>`;
  }
  if (m.type === 'circle') {
    return `<circle class="mk circle" cx="${m.cx}" cy="${m.cy}" r="${m.r}"/><circle class="hit" cx="${m.cx}" cy="${m.cy}" r="${m.r}" style="fill:transparent"/>`;
  }
  const d = w / 45;
  const path = `M${m.cx - d},${m.cy - d} L${m.cx + d},${m.cy + d} M${m.cx + d},${m.cy - d} L${m.cx - d},${m.cy + d}`;
  return `<path class="mk" d="${path}"/><path class="hit" d="${path}"/>`;
}
function numberPos(m, w) {
  const off = w / 32;
  if (m.type === 'line') { const [x, y] = m.pts[0]; return [x - off * .7, y - off * .7]; }
  if (m.type === 'circle') return [m.cx + m.r * .75 + off * .5, m.cy - m.r * .75 - off * .5];
  return [m.cx + off * 1.1, m.cy - off * 1.1];
}
function renderMarks() {
  const order = new Map(activeMarks().map((m, i) => [m.id, i + 1]));
  for (const key of Object.keys(VIEWS)) {
    const w = VIEWS[key].def.w;
    const r = w / 48;
    svgOf(key).querySelector('.marks').innerHTML = S.marks.filter((m) => m.view === key && order.has(m.id)).map((m) => {
      const [nx, ny] = numberPos(m, w);
      return `<g class="k-${KINDS[m.type].cls}" data-mark="${m.id}">${markShape(m, w)}
        <g class="mn"><circle cx="${nx}" cy="${ny}" r="${r}"/><text x="${nx}" y="${ny}" font-size="${r * 1.25}">${order.get(m.id)}</text></g></g>`;
    }).join('');
  }
}

let drawing = null;
$('stage').addEventListener('pointerdown', (e) => {
  const svg = e.target.closest('svg');
  if (!svg) return;
  if (tool === 'erase') {
    const g = e.target.closest('[data-mark]');
    if (g) removeMark(g.dataset.mark);
    return;
  }
  e.preventDefault();
  svg.setPointerCapture(e.pointerId);
  const p = toSvgPoint(svg, e);
  const w = VIEWS[view].def.w;
  const m = { id: uid(), view, type: tool, size: 'M', amount: SIZES.M.price };
  if (tool === 'line') m.pts = [p];
  else { m.cx = p[0]; m.cy = p[1]; m.r = tool === 'circle' ? 0 : undefined; }
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.setAttribute('class', `k-${KINDS[tool].cls}`);
  svg.querySelector('.marks').appendChild(g);
  drawing = { svg, m, g, w, start: p };
  if (tool === 'cross') finishDrawing();
  else g.innerHTML = markShape(m, w);
});
$('stage').addEventListener('pointermove', (e) => {
  if (!drawing) return;
  const { m, g, w, svg, start } = drawing;
  const p = toSvgPoint(svg, e);
  if (m.type === 'line') {
    const last = m.pts[m.pts.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < w / 200) return;
    m.pts.push(p);
  } else {
    m.r = Math.round(Math.hypot(p[0] - start[0], p[1] - start[1]) * 10) / 10;
  }
  g.innerHTML = markShape(m, w);
});
const endDrawing = () => { if (drawing) finishDrawing(); };
$('stage').addEventListener('pointerup', endDrawing);
$('stage').addEventListener('pointercancel', endDrawing);

function finishDrawing() {
  const { svg, m, g, w } = drawing;
  drawing = null;
  g.remove();
  if (m.type === 'line') {
    const [a, b] = [m.pts[0], m.pts[m.pts.length - 1]];
    const len = m.pts.reduce((acc, p, i) => i ? acc + Math.hypot(p[0] - m.pts[i - 1][0], p[1] - m.pts[i - 1][1]) : 0, 0);
    if (len < w / 60) { toast('もう少し長くなぞってください'); return; }
    m.panel = panelAt(svg, anchorOf(m)) || panelAt(svg, a) || panelAt(svg, b);
  } else {
    if (m.type === 'circle' && m.r < w / 40) m.r = w / 30;
    if (m.type === 'cross') delete m.r;
    m.panel = panelAt(svg, [m.cx, m.cy]);
  }
  S.marks.push(m);
  renderAll();
  saveDraft();
  openSheet(m.id);
}

function removeMark(id) {
  S.marks = S.marks.filter((m) => m.id !== id);
  renderAll();
  saveDraft();
}

  $('markList').innerHTML = marks.length === 0
    ? '<p class="empty">図に描くと、ここに出ます</p>'
    : marks.map((m, i) => {
        const k = KINDS[m.type];
        const seg = Object.entries(SIZES).map(([s, v]) =>
          `<button data-size="${s}" class="${m.size === s ? 'on' : ''}">${v.label}</button>`).join('');
        return `<div class="mrow" data-mark="${m.id}">
          <div class="mrow-head"><span class="mnum b-${k.cls}">${i + 1}</span><span class="badge b-${k.cls}">${k.label}</span><b>${panelName(m)}</b><span style="font-size:11px;color:var(--muted)">（${VIEWS[m.view].label}）</span><button class="x" aria-label="消す">×</button></div>
          <div class="mrow-body"><div class="seg">${seg}</div><div class="yen"><input class="money-in m-amount" type="text" inputmode="numeric" value="${yen(m.amount)}"></div></div>
        </div>`;
      }).join('');
}
$('markList').addEventListener('click', (e) => {
  const row = e.target.closest('.mrow');
  if (!row) return;
  const id = row.dataset.mark;
  if (e.target.closest('.x')) removeMark(id);
  else if (e.target.closest('[data-size]')) setSize(id, e.target.closest('[data-size]').dataset.size);
});
$('markList').addEventListener('input', (e) => {
  if (!e.target.classList.contains('m-amount')) return;
  const m = S.marks.find((x) => x.id === e.target.closest('.mrow').dataset.mark);
  m.amount = toDigits(e.target.value);
  e.target.value = yen(m.amount);
  renderTotals();
  saveDraft();
});

// ---- パーツ ----
function renderSuggest() {
  const have = new Set(S.parts.map((p) => p.name));
  const list = [];
  for (const m of activeMarks()) {
    if (!m.panel) continue;
    for (const name of PANELS[m.panel].parts) if (!have.has(name) && !list.includes(name)) list.push(name);
  }
  $('suggest').innerHTML = list.length === 0 ? '' :
    `<p>描いた場所から、要りそうなパーツ（タップで追加）</p><div class="chips">${
      list.map((n) => `<button class="chip" data-name="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join('')}</div>`;
}
$('suggest').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  addPart(chip.dataset.name);
});
function addPart(name = '') {
  S.parts.push({ id: uid(), name, qty: 1, price: '' });
  renderParts();
  renderSuggest();
  renderTotals();
  saveDraft();
  const rows = document.querySelectorAll('.prow');
  const last = rows[rows.length - 1];
  if (last) last.querySelector(name ? '.p-price' : '.p-name').focus();
}
$('addPart').addEventListener('click', () => addPart());

function partCalcHtml(p) {
  const c = partCalc(p);
  return num(p.price)
    ? `<span>仕入れ（税込）${money(c.cost)}</span><span>請求 <b>${money(c.charge)}</b></span>`
    : '<span>税抜の金額を入れてください</span><span></span>';
}
function renderParts() {
  $('partList').innerHTML = S.parts.map((p) => `<div class="prow" data-part="${p.id}">
      <div class="prow-head"><input class="p-name" type="text" placeholder="パーツ名" value="${escapeHtml(p.name)}"><button class="x" aria-label="削除">×</button></div>
      <div class="prow-body">
        <div><label>数量</label><input class="qty" type="number" inputmode="numeric" min="1" value="${p.qty}"></div>
        <div><label>税抜の金額（1個あたり）</label><div class="yen"><input class="money-in p-price" type="text" inputmode="numeric" placeholder="0" value="${yen(p.price)}"></div></div>
      </div>
      <div class="prow-calc">${partCalcHtml(p)}</div>
    </div>`).join('');
}
$('partList').addEventListener('click', (e) => {
  if (!e.target.closest('.x')) return;
  const id = e.target.closest('.prow').dataset.part;
  S.parts = S.parts.filter((p) => p.id !== id);
  renderParts();
  renderSuggest();
  renderTotals();
  saveDraft();
});
$('partList').addEventListener('input', (e) => {
  const row = e.target.closest('.prow');
  if (!row) return;
  const p = S.parts.find((x) => x.id === row.dataset.part);
  if (e.target.classList.contains('p-name')) { p.name = e.target.value; renderSuggest(); }
  else if (e.target.classList.contains('qty')) p.qty = Math.max(1, num(e.target.value));
  else if (e.target.classList.contains('p-price')) { p.price = toDigits(e.target.value); e.target.value = yen(p.price); }
  row.querySelector('.prow-calc').innerHTML = partCalcHtml(p);
  renderTotals();
  saveDraft();
});

// ---- 見積金額 ----
function renderTotals() {
  const t = totals();
  $('sumRepairLabel').textContent = `キズ・ヘコミ修理（${t.count}か所）`;
  $('sumRepair').textContent = money(t.repair);
  $('sumParts').textContent = money(t.parts);
  $('sumTravel').textContent = money(TRAVEL_FEE);
  $('sumTotal').textContent = money(t.total);
  $('sumPartsCost').textContent = money(t.partsCost);
  $('sumNet').textContent = (t.net < 0 ? '−' : '') + money(Math.abs(t.net));
  $('net').classList.toggle('minus', t.net < 0);
}

function renderAll() {
  renderMarks();
  renderTabs();
  renderMarkList();
  renderSuggest();
  renderParts();
  renderTotals();
}

// ---- 保存・送る ----
function renderRecords() {
  const recs = load(REC_KEY, []);
  $('recCount').textContent = recs.length ? `${recs.length}件` : '';
  $('records').innerHTML = recs.length === 0
    ? '<p class="empty">まだありません</p>'
    : recs.map((r) => `<div class="rec">
        <div class="rec-main"><b>${escapeHtml(r.plate)}${r.mdl ? '<span class="mini-tag">モデリスタ</span>' : ''}</b>
          <small>${r.date || '日付なし'}　${r.total != null ? money(r.total) : ''}</small></div>
        <button data-open="${r.id}">開く</button>
        <button class="del" data-del="${r.id}">削除</button>
      </div>`).join('');
}
$('records').addEventListener('click', (e) => {
  const recs = load(REC_KEY, []);
  const openId = e.target.dataset.open, delId = e.target.dataset.del;
  if (openId) {
    const r = recs.find((x) => x.id === openId);
    if (!r) return;
    S = normalize(JSON.parse(JSON.stringify(r)));
    fillForm(); renderAll(); saveDraft();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast(`${r.plate} を開きました`);
  } else if (delId) {
    const r = recs.find((x) => x.id === delId);
    if (!r || !confirm(`${r.plate} のシートを削除しますか？`)) return;
    store(REC_KEY, recs.filter((x) => x.id !== delId));
    if (S.id === delId) { S.id = null; saveDraft(); }
    renderRecords();
  }
});

$('btnSave').addEventListener('click', () => {
  if (!S.plate.trim()) { toast('登録番号を入れてください'); $('plate').focus(); return; }
  const recs = load(REC_KEY, []);
  S.id = S.id || uid();
  S.savedAt = new Date().toISOString();
  S.total = totals().total;
  const rec = JSON.parse(JSON.stringify(S));
  const i = recs.findIndex((x) => x.id === S.id);
  if (i >= 0) recs.splice(i, 1);
  recs.unshift(rec);
  store(REC_KEY, recs);
  saveDraft();
  renderRecords();
  toast('保存しました');
});

$('btnNew').addEventListener('click', () => {
  const touched = S.plate || S.odagiri || S.marks.length || S.parts.length || S.memo;
  if (touched && !confirm('いまの内容を消して、新しいシートにしますか？\n（保存したシートは残ります）')) return;
  S = blank();
  fillForm(); renderAll(); saveDraft();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function shareText() {
  const t = totals();
  const lines = [
    '【キズ修理チェックシート】',
    `登録番号：${S.plate || '未記入'}`,
    `見積日：${S.date || '未記入'}`,
    `車種：アルファード／ヴェルファイア（モデリスタ：${S.mdl ? 'あり' : 'なし'}）`,
    '',
    '■ キズの場所',
  ];
  const marks = activeMarks();
  if (marks.length === 0) lines.push('なし');
  marks.forEach((m, i) => lines.push(`${i + 1}. ${panelName(m)}　${KINDS[m.type].label}（${SIZES[m.size].label}）${money(m.amount)}`));
  if (S.parts.length) {
    lines.push('', '■ パーツ（税抜 → 請求）');
    for (const p of S.parts) {
      const c = partCalc(p);
      lines.push(`・${p.name || '名前なし'}${num(p.qty) > 1 ? ' ×' + p.qty : ''}　${money(num(p.price) * Math.max(1, num(p.qty)))} → ${money(c.charge)}`);
    }
  }
  lines.push(
    '',
    '■ 見積金額',
    `キズ・ヘコミ修理：${money(t.repair)}`,
    `パーツ：${money(t.parts)}`,
    `出張料：${money(TRAVEL_FEE)}`,
    `合計：${money(t.total)}`,
    '',
    `小田切さんに渡す金額：${S.odagiri !== '' ? money(S.odagiri) : '未記入'}`,
    `パーツの仕入れ（税込）：${money(t.partsCost)}`,
    `手元に残る金額：${(t.net < 0 ? '−' : '') + money(Math.abs(t.net))}`,
  );
  if (S.memo.trim()) lines.push('', '■ 備考', S.memo.trim());
  return lines.join('\n');
}
$('btnShare').addEventListener('click', async () => {
  const text = shareText();
  if (navigator.share) {
    try { await navigator.share({ text }); } catch {}
    return;
  }
  try { await navigator.clipboard.writeText(text); toast('コピーしました。LINEなどに貼り付けてください'); }
  catch { prompt('この文章をコピーしてください', text); }
});

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

fillForm();
setTool('line');
setView('left');
renderAll();
</script>
</body>
</html>
